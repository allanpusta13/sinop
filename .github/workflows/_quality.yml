# Reusable quality gate: Pint, PHPStan and Pest via `composer ci:check`.
# Called by develop.yml, master.yml and production.yml.
name: Quality

on:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: Pint, PHPStan and Pest
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Setup application
        run: composer setup

      - name: Run CI checks
        run: composer ci:check
